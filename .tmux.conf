################################
# General
################################

set -g history-limit 50000
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g set-titles on
set -g xterm-keys on
set -g mouse on

# Fix colors and improve escape time (important for vim/neovim)
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",tmux-256color:Tc"
set -s escape-time 10
set -g focus-events on
set -g display-time 2000
set -g detach-on-destroy off

# Visual activity monitoring
setw -g monitor-activity on
set -g visual-activity on

################################
# Prefix: Ctrl + a
################################

unbind C-b
set -g prefix C-a
bind C-a send-prefix

################################
# Reload config
################################

unbind r
bind r source-file ~/.tmux.conf \; display 'Reloaded tmux config.'

################################
# Session / window / pane management
################################

# New session
unbind n
unbind C-n
bind-key n new-session
bind-key C-n new-session

# New window
unbind t
unbind C-t
bind-key t new-window
bind-key C-t new-window

# Kill pane / session
unbind w
unbind C-w
bind-key w kill-pane
bind-key C-w kill-pane

unbind q
unbind C-q
bind-key q kill-session
bind-key C-q kill-session

# Splits: g = vertical (side by side), h = horizontal (top/bottom)
unbind g
unbind C-g
bind-key g split-window -h -c "#{pane_current_path}"
bind-key C-g split-window -h -c "#{pane_current_path}"

unbind h
unbind C-h
bind-key h split-window -v -c "#{pane_current_path}"
bind-key C-h split-window -v -c "#{pane_current_path}"

# Window navigation
unbind Pagedown
unbind Pageup
bind-key Pagedown next-window
bind-key Pageup previous-window

# Detach / paste
bind-key C-d detach-client
bind-key C-p paste-buffer

# Redraw client
bind R refresh-client

# Dev layout (pass current pane path so the layout opens in the right dir)
bind D run-shell "bash ~/.tmux/dev_1.sh '#{pane_current_path}'"

################################
# Pane navigation
################################

# Alt+arrow (no prefix)
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Pane navigation (prefix + jk for vertical, Left/Right for horizontal)
# Note: h is bound to horizontal split, so j/k/Left/Right are used here
bind-key j select-pane -D
bind-key k select-pane -U
bind-key Left  select-pane -L
bind-key Right select-pane -R

# Pane resizing (prefix + HJKL, repeatable)
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r H resize-pane -L 5
bind -r L resize-pane -R 5

################################
# Copy mode (vi keys)
################################

setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y   send -X copy-selection-and-cancel
bind -T copy-mode-vi H   send -X start-of-line
bind -T copy-mode-vi L   send -X end-of-line

################################
# Status bar
################################

set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

set -g status-left-length 40
set -g status-left "#[bg=#89b4fa,fg=#1e1e2e,bold] #S #[bg=#1e1e2e,fg=#89b4fa] "

set -g status-right-length 60
set -g status-right "#[fg=#a6e3a1] %Y-%m-%d #[fg=#cdd6f4]%H:%M "

set -g window-status-format         " #I:#W "
set -g window-status-current-format "#[bg=#313244,fg=#cdd6f4,bold] #I:#W#{?window_zoomed_flag,[Z],} "

set -g pane-border-style        "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

################################
# Plugins
# https://github.com/tmux-plugins/tpm
################################

set -g @plugin 'tmux-plugins/tpm'

# tmux-resurrect - save/restore sessions across restarts
# Save: prefix + C-s   Restore: prefix + C-r
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'

# tmux-continuum - automatic save/restore
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

# tmux-yank - system clipboard integration (WSL2: pipe to clip.exe)
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @yank_action 'copy-pipe-no-clear'
set -g @override_copy_command 'clip.exe'

# Initialize TPM (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'
